[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/desktop"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/vitorhubdev/standardnotes-rune"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 8

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
